name: Quality and PostgreSQL integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: caseflow
          POSTGRES_USER: caseflow_admin
          POSTGRES_PASSWORD: caseflow_admin_dev
          CASEFLOW_APP_PASSWORD: caseflow_app_dev
          CASEFLOW_SEED_PASSWORD: caseflow_seed_dev
          CASEFLOW_CHECKPOINT_PASSWORD: caseflow_checkpoint_dev
          CASEFLOW_ACTION_PASSWORD: caseflow_action_dev
          CASEFLOW_EMBEDDING_INDEX_PASSWORD: caseflow_embedding_index_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caseflow_admin -d caseflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CASEFLOW_MODE: offline_test
      DATABASE_URL: postgresql+psycopg://caseflow_app:caseflow_app_dev@127.0.0.1:5432/caseflow
      SEED_DATABASE_URL: postgresql+psycopg://caseflow_seed:caseflow_seed_dev@127.0.0.1:5432/caseflow
      TEST_DATABASE_URL: postgresql+psycopg://caseflow_app:caseflow_app_dev@127.0.0.1:5432/caseflow_test
      TEST_SEED_DATABASE_URL: postgresql+psycopg://caseflow_seed:caseflow_seed_dev@127.0.0.1:5432/caseflow_test
    steps:
      - uses: actions/checkout@v4
      - name: Initialize isolated PostgreSQL service
        run: |
          container_id="$(docker ps --filter ancestor=pgvector/pgvector:pg17 --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker cp docker/postgres/init/01-create-roles.sh "$container_id:/tmp/01-create-roles.sh"
          docker exec "$container_id" sh /tmp/01-create-roles.sh
          docker cp migrations "$container_id:/tmp/migrations"
          for database in caseflow caseflow_test; do
            for migration in 001_v1c_approvals.sql 002_v1c_pgvector.sql 003_v1d_pending_draft_revision.sql; do
              docker exec "$container_id" psql -v ON_ERROR_STOP=1 -U caseflow_admin -d "$database" \
                -v checkpoint_password=caseflow_checkpoint_dev \
                -v action_password=caseflow_action_dev \
                -v embedding_password=caseflow_embedding_index_dev \
                -f "/tmp/migrations/$migration"
            done
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src scripts tests
      - run: python scripts/seed_database.py
      - run: python -m pytest -q

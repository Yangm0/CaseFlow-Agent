services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: caseflow
      POSTGRES_USER: ${POSTGRES_USER:-caseflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caseflow_admin_dev}
      CASEFLOW_APP_PASSWORD: ${CASEFLOW_APP_PASSWORD:-caseflow_app_dev}
      CASEFLOW_SEED_PASSWORD: ${CASEFLOW_SEED_PASSWORD:-caseflow_seed_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - caseflow_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d caseflow"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  caseflow_pgdata:

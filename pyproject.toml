[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caseflow-agent"
version = "0.1.0"
description = "A reproducible payment-incident investigation agent (V1-C)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0.36,<2.1",
  "psycopg[binary,pool]>=3.2,<4",
  "langgraph>=0.2.60,<2",
  "langchain-core>=0.3.29,<2",
  "langchain-openai>=0.3.28,<2",
  "langchain[mcp]>=1.4,<2",
  "fastmcp>=4.0.11,<5",
  "langgraph-checkpoint-postgres>=2.0.24,<4",
  "pgvector>=0.3,<1",
  "rank-bm25>=0.2.2,<1",
  "jieba>=0.42.1,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
local-embedding = [
  "fastembed>=0.9.1,<1",
]

[project.scripts]
caseflow-mcp = "caseflow_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: uses an isolated PostgreSQL test database",
  "e2e: runs a full offline investigation against real PostgreSQL data",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
